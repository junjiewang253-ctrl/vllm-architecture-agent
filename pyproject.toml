[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-architecture-agent"
version = "1.0.0"
description = "Agent Skill for generating Draw.io diagrams from vLLM model adapter source files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vllm-arch = "vllm_architecture_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
