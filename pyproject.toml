[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-architecture-agent"
version = "2.1.1"
description = "Agent-native Skill for analyzing vLLM model adapters and producing source-grounded Draw.io architecture diagrams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vllm-arch = "vllm_architecture_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
